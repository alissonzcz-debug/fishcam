name: Build FishCam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Baixar modelo Vosk PT
        run: |
          mkdir -p app/src/main/assets/model-pt
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -O vosk-model.zip
          unzip -q vosk-model.zip -d vosk-tmp
          cp -r vosk-tmp/vosk-model-small-pt-0.3/* app/src/main/assets/model-pt/
          rm -rf vosk-tmp vosk-model.zip

      - name: Corrigir gradle.properties
        run: |
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties
          echo 'kotlin.code.style=official' >> gradle.properties
          cat gradle.properties

      - name: Permissão Gradle
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FishCam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
